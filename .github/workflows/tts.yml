name: Generar TTS

on:
  repository_dispatch:
    types: [generar_audio]

concurrency:
  group: tts-generation
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar edge-tts
        run: pip install edge-tts

      - name: Generar audio
        env:
          TEXTO: ${{ github.event.client_payload.texto }}
          INDICE: ${{ github.event.client_payload.indice }}
        run: |
          mkdir -p output
          edge-tts --voice "es-AR-ElenaNeural" --text "$TEXTO" --write-media "output/escena_${INDICE}.mp3"

      - name: Subir el audio al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add output/
          git commit -m "Audio escena ${{ github.event.client_payload.indice }}" || echo "Nada para commitear"
          git push
